name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Well-known Supabase local-dev demo credentials (see supabase/config.toml
  # and the `supabase start` output) — safe to commit, they only ever point
  # at the ephemeral Postgres/GoTrue containers this workflow spins up
  # itself. Never real secrets.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
  SUPABASE_ANON_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
  SUPABASE_SERVICE_ROLE_KEY: REPLACE_WITH_YOUR_LOCAL_SUPABASE_SERVICE_ROLE_KEY
  AI_FEATURES_ENABLED: "false"
  NEXT_PUBLIC_AI_FEATURES_ENABLED: "false"
  AI_CATEGORIZATION_ENABLED: "false"
  NEXT_PUBLIC_AI_CATEGORIZATION_ENABLED: "false"
  AI_OCR_ENABLED: "false"
  NEXT_PUBLIC_AI_OCR_ENABLED: "false"
  AI_NARRATIVE_ENABLED: "false"
  NEXT_PUBLIC_AI_NARRATIVE_ENABLED: "false"
  CRON_SECRET: ci-test-cron-secret

jobs:
  lint-typecheck-unit:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  integration-e2e:
    name: Integration + e2e tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (applies migrations + seed)
        run: supabase start

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run integration + e2e tests against a production build
        run: npx playwright test
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Stop Supabase
        if: always()
        run: supabase stop
