# Assignment 3 §5 — monitoring stack for Ledgr.
#
#   cd assignment3/monitoring && docker compose up -d
#
#   Prometheus  http://localhost:9090
#   Grafana     http://localhost:3001  (admin / admin)
#
# Grafana is fully provisioned from files in this directory: the Prometheus
# data source and the Ledgr dashboard are created on first boot, so the
# dashboard is reproducible from the repository rather than being clicked
# together by hand and lost with the container.
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: ledgr_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    extra_hosts:
      # The Next.js server under test runs on the macOS host, not in a
      # container, so the scrape target has to resolve back out of the
      # Docker network. Docker Desktop provides this name; the mapping is
      # declared explicitly so the same file works on Linux hosts too.
      - "host.docker.internal:host-gateway"

  # Host-level resource metrics.
  #
  # Note for anyone reproducing this on macOS: Docker Desktop runs
  # containers inside a Linux VM, so node-exporter reports that VM rather
  # than macOS itself, and the `--path.rootfs=/` + rslave bind mount used
  # on Linux hosts is rejected outright ("path / is mounted on / but it is
  # not a shared or slave mount"). The /proc + /sys mounts below are the
  # portable form. The authoritative CPU and memory figures for Ledgr come
  # from prom-client's process collectors, which measure the real Node
  # process on the host; node-exporter provides the surrounding
  # machine-level context.
  node-exporter:
    image: prom/node-exporter:latest
    container_name: ledgr_node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

  grafana:
    image: grafana/grafana:latest
    container_name: ledgr_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
