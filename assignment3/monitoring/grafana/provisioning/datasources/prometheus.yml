apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: ledgr-prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Must match `scrape_interval` in prometheus.yml, or Grafana picks a
      # minimum step that silently smooths the load-test ramp away.
      timeInterval: 5s
      httpMethod: POST
