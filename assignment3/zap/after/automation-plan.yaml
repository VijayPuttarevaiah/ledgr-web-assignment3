env:
  contexts:
    - name: ledgr
      urls:
        - "http://host.docker.internal:3100"
      includePaths:
        - "http://host.docker.internal:3100.*"
      excludePaths:
        - "http://host.docker.internal:3100/_next/static/.*"
        - "http://host.docker.internal:3100/api/metrics.*"
  parameters:
    failOnError: false
    failOnWarning: false
    progressToStdout: true

jobs:
  - type: replacer
    parameters:
      deleteAllRules: true
    rules:
      - description: "Authenticated session captured by npm run capture:session"
        matchType: req_header
        matchString: Cookie
        matchRegex: false
        replacementString: "sb-127-auth-token=base64-"
        tokenProcessing: false

  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 25
      scanOnlyInScope: true
    rules:
      # Reads every line of every response looking for TODO/FIXME comments.
      # Harmless on HTML, pathological on multi-hundred-kilobyte bundles.
      - id: 10027
        threshold: "off"

  - type: spider
    parameters:
      context: ledgr
      maxDuration: 3
      maxDepth: 10
      numberOfThreads: 5

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: activeScan
    parameters:
      context: ledgr
      maxRuleDurationInMins: 2
      maxScanDurationInMins: 20
      threadPerHost: 4
    policyDefinition:
      defaultStrength: medium
      defaultThreshold: medium
      rules:
        - id: 40026
          name: "Cross Site Scripting (DOM Based)"
          strength: "off"
          threshold: "off"

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk
      reportFile: zap-full-report.html
      reportTitle: "Ledgr — OWASP ZAP full scan (after)"
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: zap-full-report.json
  - type: report
    parameters:
      template: traditional-md
      reportDir: /zap/wrk
      reportFile: zap-full-report.md
  - type: report
    parameters:
      template: traditional-xml
      reportDir: /zap/wrk
      reportFile: zap-full-report.xml
